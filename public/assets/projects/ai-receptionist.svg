    <linearGradient id="wave" x1="890" y1="400" x2="1450" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#F97316"/><stop offset=".5" stop-color="#FFC995"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#38BDF8" stop-opacity=".12"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="32" y="32" width="1536" height="836" rx="36" stroke="#FFFFFF" stroke-opacity=".09"/>
